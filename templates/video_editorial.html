<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:var(--bg,#f4efe6);font-family:"Lora","GFS Baskerville",Georgia,serif;
    color:var(--text,#20201d);display:flex;flex-direction:column;justify-content:center;padding:130px 96px}
  #kick{font-family:"Liberation Sans",Arial,sans-serif;font-size:28px;letter-spacing:7px;
    font-weight:700;text-transform:uppercase;color:var(--kick,#7c2b2b);white-space:nowrap;
    overflow:hidden;border-right:3px solid var(--kick,#7c2b2b);min-height:40px}
  #head{margin-top:44px}
  #head .ln{font-size:118px;line-height:1.02;font-weight:700;letter-spacing:-1px;opacity:0}
  #head .acc{color:var(--acc,#7c2b2b);font-style:italic}
  #counter{margin-top:80px;display:flex;align-items:baseline;gap:34px}
  #big{font-size:200px;font-weight:700;color:var(--acc,#7c2b2b);line-height:.9;letter-spacing:-4px}
  #clab{font-size:38px;line-height:1.3;color:var(--text,#3c3a35);max-width:430px;opacity:0}
  #second{font-size:46px;line-height:1.38;margin-top:52px;color:var(--muted,#3c3a35);opacity:0;max-width:880px}
  #take{font-size:62px;font-weight:700;margin-top:70px;opacity:0;line-height:1.1}
  #foot{font-family:"Liberation Sans",Arial,sans-serif;font-size:27px;color:var(--muted,#6d6a63);margin-top:64px;opacity:0}
</style></head><body>
  <div id="kick"></div>
  <div id="head"></div>
  <div id="counter"><div id="big">0</div><div id="clab"></div></div>
  <div id="second"></div>
  <div id="take"></div>
  <div id="foot"></div>
<script>
/*__DATA_SLOT__*/
const SAMPLE={kicker:"The Insurance Paradox",headline:"Rates fell.\nYour bill [[went up.]]",
  stats:[{n:"14%",label:"Citizens cuts averaged this much — for ~27,000 Broward homes."}],
  video_second:"… yet the average Florida premium is now $8,300.",
  takeaway:"Underwrite the house, not the headline.",
  attribution:"Roger Averbuj, Broker · Prestige Heritage Realty · (954) 663-8461",
  palette:{bg:"#f4efe6",text:"#20201d",acc:"#7c2b2b",kick:"#7c2b2b",muted:"#6d6a63"}};
const D=window.DATA||SAMPLE, P=D.palette||{};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(s){return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>');}
function id(x){return document.getElementById(x);}
var rs=document.documentElement.style;
["bg","text","acc","kick","muted"].forEach(function(k){if(P[k])rs.setProperty("--"+k,P[k]);});
var lines=(D.headline||"").split("\n");
id("head").innerHTML=lines.map(function(l){return '<div class="ln">'+hl(l)+'</div>';}).join("");
var lnEls=id("head").querySelectorAll(".ln");
var st0=(D.stats&&D.stats[0])||{n:"",label:""};
id("clab").textContent=st0.label||st0.short||"";
id("second").textContent=D.video_second||D.deck||"";
id("take").textContent=D.takeaway||"";
id("foot").textContent=D.attribution||"";
function parseNum(str){var m=String(str).match(/^([^\d]*)([\d,]+)([^\d]*)$/);
  return m?{pre:m[1],val:parseInt(m[2].replace(/,/g,""),10),suf:m[3]}:{pre:"",val:0,suf:String(str)};}
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}
var CN=parseNum(st0.n||"0");
var kickFull=D.kicker||"";
var T=0;
function cl(x,a,b){return Math.max(a,Math.min(b,x));}
function eo(p){return 1-Math.pow(1-p,3);}
function rev(el,start,dur,dy){var p=eo(cl((T-start)/dur,0,1));el.style.opacity=p;
  el.style.transform="translateY("+((1-p)*(dy==null?24:dy))+"px)";}
window.seek=function(t){T=t;
  var kp=cl(T/0.9,0,1);
  id("kick").textContent=kickFull.slice(0,Math.round(kickFull.length*kp));
  id("kick").style.borderRightColor=(Math.floor(T*2)%2?(P.kick||"#7c2b2b"):"transparent");
  for(var i=0;i<lnEls.length;i++)rev(lnEls[i],1.0+i*0.25,0.6,20);
  var cp=eo(cl((T-2.3)/1.4,0,1));
  id("big").textContent=CN.pre+fmt(Math.round(CN.val*cp))+CN.suf;
  id("clab").style.opacity=eo(cl((T-2.4)/0.7,0,1));
  rev(id("second"),4.0,0.7);
  rev(id("take"),4.9,0.7,26);
  id("foot").style.opacity=eo(cl((T-5.5)/0.7,0,1));};
seek(0);
</script>
</body></html>
