<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#efe9df;font-family:"GFS Baskerville","Lora",Georgia,serif;color:#22201c;
    padding:104px 100px 84px;display:flex;flex-direction:column}
  .logo{height:82px;object-fit:contain;margin:0 auto 0}
  .k{text-align:center;font-family:"Liberation Sans",Arial,sans-serif;font-size:19px;letter-spacing:7px;
    text-transform:uppercase;color:#9a8b6a;margin-top:64px}
  .hair{width:64px;height:1px;background:#b89a52;margin:34px auto}
  h1{text-align:center;font-size:98px;line-height:1.08;font-weight:400;letter-spacing:-.5px;margin-top:10px}
  h1 .acc{font-style:italic;color:#8a6d2f}
  .deck{text-align:center;font-size:33px;line-height:1.5;color:#514c42;max-width:760px;margin:44px auto 0;font-style:italic}
  .spacer{flex:1}
  .stat{text-align:center;margin-bottom:8px}
  .stat .n{font-size:60px;font-weight:400;letter-spacing:2px}
  .stat .n b{color:#8a6d2f;font-weight:400}
  .stat .l{font-family:"Liberation Sans",Arial,sans-serif;font-size:19px;letter-spacing:3px;
    text-transform:uppercase;color:#9a8b6a;margin-top:14px}
  .hair2{width:64px;height:1px;background:#b89a52;margin:40px auto 34px}
  .foot{text-align:center;font-family:"Liberation Sans",Arial,sans-serif;font-size:21px;color:#6b6558;letter-spacing:.4px}
</style></head><body>
  <img class="logo" src="__LOGO_DARK__">
  <div class="k" id="kick"></div>
  <div class="hair"></div>
  <h1 id="h1"></h1>
  <div class="deck" id="deck"></div>
  <div class="spacer"></div>
  <div class="stat"><div class="n" id="strip"></div><div class="l" id="meta"></div></div>
  <div class="hair2"></div>
  <div class="foot" id="foot"></div>
<script>
/*__DATA_SLOT__*/
const SAMPLE={kicker:"The Insurance Paradox",headline:"Rates fell.\nYour bill [[went up.]]",
  deck:"Both are true — the cuts are mostly Citizens policies, landing at renewal, while private premiums keep climbing.",
  meta:"Broward County · July 2026",
  stats:[{n:"14%",short:"cut"},{n:"50%",short:"saw increases"},{n:"$8,300",short:"avg"}],
  attribution:"Roger Averbuj, Broker  |  Prestige Heritage Realty  |  (954) 663-8461"};
const D=window.DATA||SAMPLE;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(s){return esc(s).replace(/\n/g,"<br>").replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>');}
function id(x){return document.getElementById(x);}
id("kick").textContent=D.kicker||"";
id("h1").innerHTML=hl(D.headline||"");
id("deck").textContent=D.deck||"";
id("meta").textContent=D.meta||"";
id("foot").textContent=D.attribution||"";
id("strip").innerHTML=(D.stats||[]).slice(0,3).map(function(s){
  return "<b>"+esc(s.n)+"</b> "+esc(s.short||s.label||"");}).join("  ·  ");
</script>
</body></html>
