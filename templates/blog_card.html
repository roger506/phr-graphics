<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:900px;overflow:hidden}
  body{background:var(--bg,#0f1417);color:var(--text,#eef2f4);
    font-family:"Caladea","Liberation Serif",Georgia,serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:160px 250px 315px}
  #kick{font-family:"Liberation Sans",Arial,sans-serif;font-size:26px;letter-spacing:5px;
    font-weight:700;text-transform:uppercase;color:var(--kick,#2ec4b6)}
  #stat{display:flex;align-items:center;gap:32px;margin-top:24px}
  #num{font-size:104px;line-height:1;font-weight:700;color:var(--acc,#2ec4b6);white-space:nowrap}
  #nlab{font-family:"Liberation Sans",Arial,sans-serif;font-size:25px;line-height:1.38;
    color:var(--sub,#9fb0c4);max-width:620px}
  #nlab b{color:var(--text,#eef2f4);font-weight:700}
  h1{font-size:42px;line-height:1.24;font-weight:700;margin-top:28px;max-width:1100px}
  h1 .acc{color:var(--acc,#2ec4b6)}
  .foot{display:flex;align-items:center;gap:20px;margin-top:32px}
  .foot img{height:48px;object-fit:contain}
  .foot span{font-family:"Liberation Sans",Arial,sans-serif;font-size:22px;color:var(--foot,#8a97a1)}
</style></head><body>
  <div id="kick"></div>
  <div id="stat"><div id="num"></div><div id="nlab"></div></div>
  <h1></h1>
  <div class="foot"><img id="logo"><span id="ft"></span></div>
<script>
/*__DATA_SLOT__*/
const SAMPLE={kicker:"Broward County . Insurance",
  stats:[{n:"41%",label:"Florida's share of the nation's <b>insurance lawsuits</b> in 2025, down from 79% in 2020.",short:"lawsuit share",accent:true}],
  takeaway:"The panic that stalled your closing is [[losing its grip.]]",
  attribution:"Roger Averbuj, Broker | Prestige Heritage Realty | (954) 663-8461",
  palette:{bg:"#0f1417",text:"#eef2f4",acc:"#2ec4b6",kick:"#2ec4b6",sub:"#9fb0c4",foot:"#8a97a1",
    logo:"../../assets/phr_logo_white.png"}};
const D=window.DATA||SAMPLE, P=D.palette||{};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(s){return esc(s).replace(/\n/g,"<br>").replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>');}
function plain(s){return String(s==null?"":s).replace(/<\/?[^>]+>/g,"");}
function id(x){return document.getElementById(x);}
var rs=document.documentElement.style;
["bg","text","acc","kick","sub","foot"].forEach(function(k){if(P[k])rs.setProperty("--"+k,P[k]);});
var stats=D.stats||[];
var hero=null;
for(var i=0;i<stats.length;i++){if(stats[i]&&stats[i].accent){hero=stats[i];break;}}
if(!hero)hero=stats[0]||{};
id("kick").textContent=D.kicker||"";
id("num").textContent=hero.n||"";
id("nlab").innerHTML=hero.label||esc(hero.short||"");
if(!hero.n)id("stat").style.display="none";
var take=D.takeaway||D.pullquote||D.sub||D.deck||"";
document.querySelector("h1").innerHTML=hl(plain(take));
id("ft").textContent=plain(D.attribution||"");
id("logo").src=P.logo||"../../assets/phr_logo_white.png";
</script>
</body></html>
