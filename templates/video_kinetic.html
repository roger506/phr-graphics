<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:"Caladea","Liberation Serif",Georgia,serif;color:var(--text,#f5f1e8);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:120px 90px;text-align:center;background:var(--bg,#0d1f33)}
  #kick{font-family:"Liberation Sans",Arial,sans-serif;font-size:30px;letter-spacing:8px;
    font-weight:700;text-transform:uppercase;color:var(--kick,#c9a24b);margin-bottom:52px;opacity:0}
  #head{font-size:126px;line-height:1.04;font-weight:700;opacity:0}
  #head .acc{color:var(--acc,#d8b45a)}
  #sub{font-style:italic;font-size:54px;color:var(--sub,#cbb98f);margin-top:36px;opacity:0}
  #stats{display:flex;gap:80px;margin-top:60px;opacity:0}
  .stat .n{font-size:118px;font-weight:700;color:var(--text,#fff);line-height:1}
  .stat .l{font-family:"Liberation Sans",Arial,sans-serif;font-size:26px;letter-spacing:2px;
    text-transform:uppercase;color:var(--kick,#c9a24b);margin-top:14px}
  #take{font-style:italic;font-size:62px;color:var(--acc,#e7cf93);margin-top:70px;max-width:840px;line-height:1.18;opacity:0}
  #logo{height:156px;object-fit:contain;margin-top:60px;opacity:0}
  #foot{font-family:"Liberation Sans",Arial,sans-serif;font-size:28px;color:var(--foot,#93a4b8);margin-top:40px;opacity:0}
</style></head><body>
  <div id="kick"></div>
  <div id="head"></div>
  <div id="sub"></div>
  <div id="stats"></div>
  <div id="take"></div>
  <img id="logo">
  <div id="foot"></div>
<script>
/*__DATA_SLOT__*/
const SAMPLE={kicker:"The Insurance Paradox",headline:"Rates fell.\nYour bill [[went up.]]",
  sub:"Both are true.",takeaway:"Underwrite the house,\nnot the headline.",
  stats:[{n:"14%",short:"Citizens cut"},{n:"$8,300",short:"Avg premium"}],
  attribution:"Roger Averbuj, Broker · Prestige Heritage Realty",
  palette:{bg:"radial-gradient(120% 70% at 50% 8%, #16324f 0%, #0d1f33 55%, #0a1826 100%)",
    text:"#f5f1e8",acc:"#d8b45a",kick:"#c9a24b",sub:"#cbb98f",foot:"#93a4b8",
    logo:"../../assets/phr_logo_white.png"}};
const D=window.DATA||SAMPLE, P=D.palette||{};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(s){return esc(s).replace(/\n/g,"<br>").replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>');}
function plain(s){return String(s==null?"":s).replace(/<\/?[^>]+>/g,"");}
function id(x){return document.getElementById(x);}
var rs=document.documentElement.style;
["bg","text","acc","kick","sub","foot"].forEach(function(k){if(P[k])rs.setProperty("--"+k,P[k]);});
id("kick").textContent=D.kicker||"";
id("head").innerHTML=hl(D.headline||"");
id("sub").textContent=D.sub||"";
id("take").innerHTML=hl(D.takeaway||"");
id("foot").textContent=plain(D.attribution||"");
id("logo").src=P.logo||"../../assets/phr_logo_white.png";
id("stats").innerHTML=(D.stats||[]).slice(0,3).map(function(s){
  return '<div class="stat"><div class="n">'+esc(s.n)+'</div><div class="l">'+esc(s.short||"")+'</div></div>';}).join("");
if(!D.sub)id("sub").style.display="none";
var T=0;
function cl(x,a,b){return Math.max(a,Math.min(b,x));}
function eo(p){return 1-Math.pow(1-p,3);}
function rev(el,start,dur,dy){var p=eo(cl((T-start)/dur,0,1));el.style.opacity=p;
  el.style.transform="translateY("+((1-p)*(dy==null?46:dy))+"px)";}
window.seek=function(t){T=t;
  rev(id("kick"),0.0,0.6);
  rev(id("head"),0.5,0.8);
  rev(id("sub"),1.6,0.7);
  rev(id("stats"),2.6,0.8,30);
  rev(id("take"),4.0,0.9);
  rev(id("logo"),5.2,0.7,20);
  rev(id("foot"),5.6,0.7,20);};
seek(0);
</script>
</body></html>
