name: Render community assets

# Deliberately separate from render-assets.yml. That workflow triggers on
# specs/** and its tools/render.py expects the content-machine spec shape; a
# community spec would break it. Different trigger path, different script,
# different outputs. Neither pipeline can affect the other.

on:
  push:
    paths: ['community-specs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # Two 33 second cuts at 24fps is about 1600 screenshots. The content-machine
    # clips are 7.6s and finish in ~2.5 min; these are roughly 4x longer, so give
    # them real headroom rather than letting a slow runner kill a good render.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: |
          pip install playwright pandas
          python -m playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Render pending community specs
        run: python tools/render_community.py

      - name: Commit rendered assets
        run: |
          git config user.name "phr-render-bot"
          git config user.email "render@prestigeheritagerealty.com"
          git add -A assets/ community-specs/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Render community assets [skip ci]"
            git push
          fi

      # Surfaces the raw URLs in the run log so a failed Buffer fetch can be
      # diagnosed without cloning the repo.
      - name: Report asset URLs
        run: |
          for f in assets/*.png assets/*.mp4; do
            [ -e "$f" ] || continue
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$f  ($(stat -c%s "$f") bytes)"
          done
